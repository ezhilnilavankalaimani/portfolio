<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="description" content="Ezhil Nilavan Kalaimani. A rare mix of finance knowledge and analyst skills." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ezhil Nilavan Kalaimani" />
    <meta property="og:description" content="A rare mix of finance knowledge and analyst skills." />
    <meta property="og:url" content="https://ezhilnilavankalaimani.com/" />
    <meta property="og:image" content="https://ezhilnilavankalaimani.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ezhilnilavankalaimani.com/og-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ezhil Nilavan Kalaimani</title>
    <style>
      #splash{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .55s ease,visibility 0s .55s}
      #splash.out{opacity:0;visibility:hidden;pointer-events:none}
      #splash .sl{width:200px;height:auto;opacity:0;transform:scale(.85);animation:spLogo .8s cubic-bezier(.2,.9,.3,1) .1s forwards}
      @keyframes spLogo{to{opacity:1;transform:none}}
      #splash .c{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:spPop .6s cubic-bezier(.2,1.4,.4,1) forwards}
      #splash .c1{animation-delay:.35s}#splash .c2{animation-delay:.5s}#splash .c3{animation-delay:.65s}#splash .c4{animation-delay:.8s}#splash .c5{animation-delay:.95s}
      #splash .hl{opacity:0;animation:spFade .6s ease 1.1s forwards}
      #splash .rt{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:spGrow .55s ease-out forwards}
      #splash .r1{animation-delay:.05s}#splash .r2{animation-delay:.15s}#splash .r3{animation-delay:.25s}
      #splash .gl{stroke-dasharray:26;stroke-dashoffset:26;animation:spDraw .7s ease-out forwards}
      @property --r{syntax:"<percentage>";inherits:false;initial-value:0%}
      #splash .sl{position:relative;width:200px;aspect-ratio:560/403;opacity:1;transform:none;animation:none}
      #splash .sl img{position:absolute;left:0;width:100%;height:auto;display:block}
      #splash .sl .lt{top:0;clip-path:inset(0 0 46% 0);-webkit-mask-image:radial-gradient(ellipse 62% 100% at 50% 100%,#000 var(--r),transparent calc(var(--r) + 10%));mask-image:radial-gradient(ellipse 62% 100% at 50% 100%,#000 var(--r),transparent calc(var(--r) + 10%));--r:-10%;animation:spGrowT 1.7s cubic-bezier(.3,.7,.2,1) .15s forwards}
      #splash .sl .lb{top:0;clip-path:inset(54% 0 0 0);-webkit-mask-image:linear-gradient(180deg,#000 var(--r),transparent calc(var(--r) + 12%));mask-image:linear-gradient(180deg,#000 var(--r),transparent calc(var(--r) + 12%));--r:-12%;animation:spGrowB 1.5s cubic-bezier(.4,.1,.3,1) 1.35s forwards}
      @keyframes spGrowT{to{--r:112%}}@keyframes spGrowB{to{--r:112%}}
      @media (prefers-reduced-motion:reduce){#splash .sl .lt,#splash .sl .lb{animation:none;--r:120%}}
      #splash .nm{font:600 17px/1.2 -apple-system,'Inter','Segoe UI',sans-serif;color:#1d1d1f;letter-spacing:-.01em;opacity:0;animation:spUp .6s ease 1s forwards}
      #splash .tg{font:500 13px/1.2 -apple-system,'Inter','Segoe UI',sans-serif;color:#86868b;margin-top:-14px;opacity:0;animation:spUp .6s ease 1.2s forwards}
      #splash .bar{width:120px;height:3px;border-radius:3px;background:#ececf1;overflow:hidden;opacity:0;animation:spFade .4s ease .9s forwards}
      #splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#915eff,#3b6cff,#00cea8);animation:spBar 1.1s ease-in-out infinite}
      @keyframes spPop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
      @keyframes spFade{to{opacity:1}}
      @keyframes spGrow{to{transform:scaleY(1)}}
      @keyframes spDraw{to{stroke-dashoffset:0}}
      @keyframes spUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes spBar{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="sl" style="--w:200px"><img class="lt" src="/logo-banyan.png" alt="" width="560" height="403"><img class="lb" src="/logo-banyan.png" alt="" width="560" height="403"></div>
    <div class="nm">Ezhil Nilavan Kalaimani</div><div class="tg">Making work run itself.</div><div class="bar"><i></i></div></div>
    <script>
      (function(){var s=document.getElementById('splash'),t0=Date.now(),done=false;
        function hide(){if(done)return;done=true;s.classList.add('out');setTimeout(function(){s.remove()},800)}
        function go(){var w=Math.max(0,3300-(Date.now()-t0));setTimeout(hide,w)}
        if(document.readyState==='complete')go();else window.addEventListener('load',go);
        setTimeout(hide,5500);})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
