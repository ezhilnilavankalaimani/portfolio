    <style>
      #splash{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .55s ease,visibility 0s .55s}
      #splash.out{opacity:0;visibility:hidden;pointer-events:none}
      #splash svg{width:112px;height:auto;animation:spIn .9s cubic-bezier(.2,.8,.2,1) both,spFloat 2.4s ease-in-out .9s infinite}
      @keyframes spIn{from{opacity:0;transform:scale(.7) translateY(8px)}to{opacity:1;transform:none}}
      @keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @media (prefers-reduced-motion:reduce){#splash svg{animation:none}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><svg viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="SPB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#915eff"/><stop offset=".5" stop-color="#3b6cff"/><stop offset="1" stop-color="#00cea8"/></linearGradient></defs>
<g fill="url(#SPB)"><circle cx="8" cy="10" r="5.2"/><circle cx="16" cy="6.5" r="6.2"/><circle cx="24" cy="10" r="5.2"/><circle cx="12" cy="11" r="4.6"/><circle cx="20" cy="11" r="4.6"/></g>
<g fill="#fff" opacity=".18"><circle cx="14" cy="5.5" r="3.2"/><circle cx="22" cy="8.5" r="2.6"/><circle cx="9" cy="8.5" r="2.4"/></g>
<g stroke="#8e8e96" stroke-linecap="round" fill="none"><path d="M14.2 13v8.5M17.8 13v8.5" stroke-width="2.4"/><path d="M9 14.5v6.8M23 14.5v6.8M5.5 13.5v5.5M26.5 13.5v5.5" stroke-width="1.2"/></g>
<path d="M3 22.2h26" stroke="#00cea8" stroke-width="1.2" stroke-linecap="round"/></svg></div>
    <script>
      (function(){var s=document.getElementById('splash'),t0=Date.now(),done=false;
        function hide(){if(done)return;done=true;s.classList.add('out');setTimeout(function(){s.remove()},800)}
        function go(){var w=Math.max(0,1100-(Date.now()-t0));setTimeout(hide,w)}
        if(document.readyState==='complete')go();else window.addEventListener('load',go);
        setTimeout(hide,4500);})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
